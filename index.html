<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tai Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6FB; --card:#FFFFFF; --ink:#1B2340; --ink-dim:#6B7394; --line:#E4E8F4;
    --accent:#007AFF; --accent-2:#5856D6; --danger:#FF3B30; --green:#34C759;
  }
  body[data-theme="dark"]{
    --bg:#0F1220; --card:#1B1E33; --ink:#F3F1EA; --ink-dim:#9AA0C4; --line:#2C3260;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'M PLUS Rounded 1c', sans-serif; }
  .mono{font-family:'JetBrains Mono', monospace;}
  .hidden{ display:none !important; }
  .wrap{ max-width:520px; margin:0 auto; padding:20px 16px 40px; }

  .logo-card{
    border-radius:24px; padding:26px 22px; margin-bottom:18px; text-align:center; color:#fff;
    background: var(--wallpaper, linear-gradient(150deg, #4F8CFF, #7C6BFF 55%, #34C759));
    position:relative; overflow:hidden;
  }
  .logo-card h1{ font-size:22px; margin:6px 0 2px; font-weight:800; text-shadow:0 2px 10px rgba(0,0,0,.25); }
  .logo-card .ver{ font-size:12px; opacity:.9; margin-bottom:16px; }
  .mode-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .mode-btn{
    padding:9px 16px; border-radius:99px; border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.15);
    color:#fff; font-family:inherit; font-size:13px; cursor:pointer; font-weight:700;
  }
  .mode-btn.active{ background:#fff; color:var(--accent); }

  .search-bar{ display:flex; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 6px 6px 16px; margin-bottom:14px; box-shadow:0 6px 20px rgba(20,30,60,.06); }
  .search-bar input{ flex:1; border:none; background:none; outline:none; font-size:15px; color:var(--ink); font-family:inherit; }
  .search-bar button{ width:44px; height:44px; border-radius:12px; background:var(--accent); border:none; color:#fff; font-size:17px; cursor:pointer; flex-shrink:0; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px; }
  h2{ font-size:15px; margin:0 0 10px; font-weight:800; }
  .sub{ color:var(--ink-dim); font-size:12.5px; margin:0 0 14px; line-height:1.55; }

  .recent-row{ display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); font-size:13.5px; cursor:pointer; }
  .recent-row:last-child{ border-bottom:none; }
  .recent-row .ic{ opacity:.5; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .icon-btn{ width:38px; height:38px; border-radius:12px; background:var(--card); border:1px solid var(--line); color:var(--ink); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .back-btn{ width:36px; height:36px; border-radius:11px; background:var(--card); border:1px solid var(--line); color:var(--ink); font-size:16px; cursor:pointer; margin-bottom:12px; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--ink-dim); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; background:var(--bg); border:1px solid var(--line);
    border-radius:12px; color:var(--ink); font-size:14.5px; font-family:inherit; outline:none;
  }
  .btn{ width:100%; padding:13px 15px; border-radius:13px; border:none; font-family:inherit; font-weight:800; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary{ background:var(--accent); color:#fff; margin-top:6px; }
  .btn-outline{ background:transparent; color:var(--ink); border:1px solid var(--line); margin-top:8px; }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid rgba(255,59,48,.4); margin-top:8px; }
  .btn-google{ background:#fff; color:#1F2937; margin-top:8px; border:1px solid var(--line); }
  .btn-google svg{width:16px;height:16px;}
  .divider{ display:flex; align-items:center; gap:10px; margin:14px 0; color:var(--ink-dim); font-size:11px; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  .msg{ font-size:12.5px; padding:10px 12px; border-radius:10px; margin-bottom:12px; display:none; line-height:1.5; }
  .msg.show{ display:block; }
  .msg.error{ background:rgba(255,59,48,.1); color:#D9342B; }
  .msg.success{ background:rgba(52,199,89,.12); color:#1F8A3C; }

  /* Web結果 */
  .result-item{ padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .result-item:last-child{ border-bottom:none; }
  .result-item .src{ font-size:11.5px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; margin-bottom:2px; }
  .result-item .title{ font-size:15px; color:var(--accent); font-weight:700; margin-bottom:3px; }
  .result-item .snippet{ font-size:12.5px; color:var(--ink-dim); line-height:1.5; }
  .fav-btn{ background:none; border:none; font-size:15px; cursor:pointer; float:right; }

  /* AI結果 */
  .ai-answer{ font-size:14px; line-height:1.8; white-space:pre-wrap; }
  .ai-sources{ margin-top:14px; }
  .ai-source-chip{ display:inline-block; padding:5px 10px; background:var(--bg); border:1px solid var(--line); border-radius:99px; font-size:11px; margin:0 6px 6px 0; color:var(--accent); cursor:pointer; }

  /* image結果 */
  .image-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .image-item{ border-radius:12px; overflow:hidden; background:var(--bg); cursor:pointer; position:relative; }
  .image-item img{ width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .image-item img.blurred{ filter:blur(18px); }
  .image-item .cap{ padding:6px 8px; font-size:10.5px; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .blur-note{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; background:rgba(0,0,0,.2); }

  /* オプション */
  .opt-row{ display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .opt-row:last-child{ border-bottom:none; }
  .opt-row .ic{ width:34px; height:34px; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .opt-row .t{ flex:1; font-size:14px; font-weight:600; }
  .opt-row .arrow{ color:var(--ink-dim); }

  .set-cat-title{ font-size:10.5px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; margin:16px 4px 6px; }
  .set-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .set-row:last-child{ border-bottom:none; }
  .set-row .desc{ font-size:10.5px; color:var(--ink-dim); }
  .switch{ position:relative; width:42px; height:24px; background:var(--line); border-radius:99px; border:none; cursor:pointer; flex-shrink:0; }
  .switch.on{ background:var(--green); }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s; }
  .switch.on::after{ transform:translateX(18px); }
  .btn-sm{ width:auto; padding:8px 12px; font-size:12px; margin-top:0; }

  .swatch-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .swatch{ width:34px; height:34px; border-radius:10px; cursor:pointer; border:2px solid transparent; }
  .swatch.active{ border-color:var(--ink); }

  .map-box{ width:100%; height:220px; border-radius:14px; overflow:hidden; margin-bottom:12px; background:var(--bg); }
  .shop-item{ display:flex; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .shop-item img{ width:56px; height:56px; border-radius:10px; object-fit:cover; flex-shrink:0; }
  .shop-item .t{ font-size:13px; font-weight:700; }
  .shop-item .p{ font-size:12.5px; color:var(--danger); font-weight:800; }

  .loading{ text-align:center; color:var(--ink-dim); font-size:13px; padding:20px 0; }
  .footnote{ text-align:center; color:var(--ink-dim); font-size:10.5px; margin-top:14px; opacity:.7; }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <!-- ==== ログイン画面 ==== -->
  <div id="loginScreen">
    <div class="logo-card">
      <h1>Tai Search</h1>
      <div class="ver">Web Edition ver.1.0.0β</div>
    </div>
    <div class="card">
      <h2>ログイン</h2>
      <div id="loginMsg" class="msg"></div>
      <button class="btn btn-google" id="googleBtn">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.58-5.17 3.58-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.87-3c-1.08.72-2.45 1.15-4.08 1.15-3.13 0-5.78-2.11-6.73-4.96H1.28v3.09A11.996 11.996 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28V6.63H1.28A12 12 0 0 0 0 12c0 1.94.47 3.77 1.28 5.37l3.99-3.09z"/><path fill="#EA4335" d="M12 4.76c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.23 0 12 0 7.31 0 3.26 2.69 1.28 6.63l3.99 3.09C6.22 6.87 8.87 4.76 12 4.76z"/></svg>
        Googleでログイン
      </button>
      <div class="field"><label>メールアドレス</label><input type="email" id="loginEmail"></div>
      <div class="field"><label>パスワード</label><input type="password" id="loginPassword"></div>
      <button class="btn btn-primary" id="loginBtn">ログイン</button>
      <div class="divider">アカウントがない?</div>
      <div class="field"><label>表示名</label><input type="text" id="signupName"></div>
      <div class="field"><label>メールアドレス</label><input type="email" id="signupEmail"></div>
      <div class="field"><label>パスワード</label><input type="password" id="signupPassword"></div>
      <button class="btn btn-outline" id="signupBtn">新規登録</button>
    </div>
  </div>

  <!-- ==== ホーム(けんさくホーム) ==== -->
  <div id="homeScreen" class="hidden">
    <div class="topbar">
      <div style="width:38px;"></div>
      <div></div>
      <button class="icon-btn" id="optionsBtn">⚙️</button>
    </div>
    <div class="logo-card" id="logoCard">
      <h1>Tai Search</h1>
      <div class="ver">Web Edition ver.1.0.0β</div>
      <div class="mode-row" id="modeRow">
        <button class="mode-btn active" data-mode="ai">AI</button>
        <button class="mode-btn" data-mode="web">Web</button>
        <button class="mode-btn" data-mode="image">image</button>
        <button class="mode-btn" id="moreModeBtn">•••</button>
      </div>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="けんさく...">
      <button id="searchGoBtn">🔍</button>
    </div>
    <div class="card" id="recentCard">
      <h2>さいきんのけんさく</h2>
      <div id="recentList"></div>
    </div>
  </div>

  <!-- ==== その他モード選択シート ==== -->
  <div id="moreModeSheet" class="hidden" style="position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center;">
    <div style="width:100%; max-width:520px; background:var(--card); border-radius:20px 20px 0 0; padding:18px;">
      <h2>もっと見る</h2>
      <div class="opt-row" data-mode="news"><div class="ic">📰</div><div class="t">ニュース</div></div>
      <div class="opt-row" data-mode="video"><div class="ic">🎬</div><div class="t">動画</div></div>
      <div class="opt-row" data-mode="map"><div class="ic">🗺️</div><div class="t">マップ</div></div>
      <div class="opt-row" data-mode="shopping"><div class="ic">🛒</div><div class="t">ショッピング</div></div>
      <div class="opt-row" data-mode="academic"><div class="ic">📚</div><div class="t">学術/論文</div></div>
      <button class="btn btn-outline" id="closeMoreModeBtn">閉じる</button>
    </div>
  </div>

  <!-- ==== 検索結果画面 ==== -->
  <div id="resultsScreen" class="hidden">
    <button class="back-btn" id="resultsBack">←</button>
    <div class="search-bar">
      <input type="text" id="resultsSearchInput" placeholder="けんさく...">
      <button id="resultsSearchGoBtn">🔍</button>
    </div>
    <div id="resultsBody"></div>
  </div>

  <!-- ==== オプション ==== -->
  <div id="optionsScreen" class="hidden">
    <button class="back-btn" id="optionsBack">←</button>
    <h1 style="font-size:19px;">オプション</h1>
    <div class="card">
      <div class="opt-row" id="toAccountOpt"><div class="ic">👤</div><div class="t">アカウント</div><div class="arrow">›</div></div>
      <div class="opt-row" id="toSearchSettingsOpt"><div class="ic">🔍</div><div class="t">けんさく設定</div><div class="arrow">›</div></div>
      <div class="opt-row" id="toPersonalOpt"><div class="ic">🎨</div><div class="t">個人設定</div><div class="arrow">›</div></div>
      <div class="opt-row" id="toFavOpt"><div class="ic">⭐</div><div class="t">おきにいり</div><div class="arrow">›</div></div>
    </div>
  </div>

  <div id="accountScreen" class="hidden"><button class="back-btn" id="accountBack">←</button><h1 style="font-size:19px;">アカウント</h1><div id="accountScroll"></div></div>
  <div id="searchSettingsScreen" class="hidden"><button class="back-btn" id="searchSettingsBack">←</button><h1 style="font-size:19px;">けんさく設定</h1><div id="searchSettingsScroll"></div></div>
  <div id="personalScreen" class="hidden"><button class="back-btn" id="personalBack">←</button><h1 style="font-size:19px;">個人設定</h1><div id="personalScroll"></div></div>
  <div id="favScreen" class="hidden"><button class="back-btn" id="favBack">←</button><h1 style="font-size:19px;">おきにいり</h1><div id="favList"></div></div>

  <p class="footnote">Tai Search Web Edition ver.1.0.0β</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, updateProfile, GoogleAuthProvider, signInWithPopup
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, limit, getDocs, deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNKPM8KCe6RGWuaQOUDorBtjCD3IGoe1E",
    authDomain: "tai-account.firebaseapp.com",
    projectId: "tai-account",
    storageBucket: "tai-account.firebasestorage.app",
    messagingSenderId: "579819210756",
    appId: "1:579819210756:web:7eba19a9d4c2ac7697cd51"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  // ==== デフォルトAPIキー(オプション画面から変更可能) ====
  const DEFAULT_KEYS = {
    gemini: "AQ.Ab8RN6Ia7zzuJ-KBgxxyKkyECoX8vizs5Tsrzp1zEcUEkR_w-Q",
    youtube: "AIzaSyCtCHdovZDot1MUPmJo2YfcvKad1OLThak",
    rakutenAppId: "YOUR_RAKUTEN_APPLICATION_ID", // ← UUID形式の「アプリケーションID」をここに
    rakutenAccessKey: "pk_P7iCwKMiuljohdy9WqxnySw4typMPve6MPl19PBSeXq"
  };
  function getKey(name){ return localStorage.getItem('ts_key_' + name) || DEFAULT_KEYS[name] || ''; }
  function setKey(name, val){ localStorage.setItem('ts_key_' + name, val); }

  function setMsg(id, text, type){ const el = document.getElementById(id); el.textContent = text; el.className = 'msg show ' + type; }
  function clearMsg(id){ document.getElementById(id).className = 'msg'; }

  // ================= 認証 =================
  let currentUser = null;
  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (user) { await loadUserData(user.uid); showScreen('home'); renderRecent(); }
    else showScreen('login');
  });
  document.getElementById('googleBtn').addEventListener('click', async () => {
    clearMsg('loginMsg');
    try { await signInWithPopup(auth, googleProvider); } catch (err) { setMsg('loginMsg', err.message, 'error'); }
  });
  document.getElementById('loginBtn').addEventListener('click', async () => {
    clearMsg('loginMsg');
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPassword').value;
    if (!email || !pw) { setMsg('loginMsg', 'メールアドレスとパスワードを入力してね。', 'error'); return; }
    try { await signInWithEmailAndPassword(auth, email, pw); } catch (err) { setMsg('loginMsg', err.message, 'error'); }
  });
  document.getElementById('signupBtn').addEventListener('click', async () => {
    clearMsg('loginMsg');
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const pw = document.getElementById('signupPassword').value;
    if (!name || !email || !pw) { setMsg('loginMsg', 'ぜんぶ入力してね。', 'error'); return; }
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      await updateProfile(cred.user, { displayName: name });
      setDoc(doc(db, 'users', cred.user.uid), { displayName:name, email, lastLogin: serverTimestamp() }, { merge:true });
    } catch (err) { setMsg('loginMsg', err.message, 'error'); }
  });

  // ================= ユーザーデータ(たいSearch用) =================
  let userData = null;
  const DEFAULT_USER_DATA = {
    recentSearches: [], favorites: [],
    searchSettings: { sensitiveMode:'block', sensitiveScopeSite:true, sensitiveScopeImage:true, sensitiveScopeVideo:true, safeLevel:'standard', resultsCount:'10', openInNewTab:true, suggest:true, saveHistory:true, excludeSites:'', favoriteSites:'', langFilter:'ja', regionFilter:'jp', periodFilter:'any', aiDetail:'normal', showCiteLinks:true, autocompleteSource:'history', previewOnHover:false },
    personalization: { wallpaper:'default', accent:'#007AFF', theme:'light', customBgUrl:'' },
  };
  async function loadUserData(uid){
    try {
      const snap = await getDoc(doc(db, 'taiSearchUsers', uid));
      userData = snap.exists() ? deepMerge(structuredCloneSafe(DEFAULT_USER_DATA), snap.data()) : structuredCloneSafe(DEFAULT_USER_DATA);
    } catch(e) { userData = structuredCloneSafe(DEFAULT_USER_DATA); }
    applyPersonalization();
  }
  function structuredCloneSafe(o){ return JSON.parse(JSON.stringify(o)); }
  function deepMerge(base, override){
    for (const k in override) {
      if (override[k] && typeof override[k] === 'object' && !Array.isArray(override[k]) && base[k]) deepMerge(base[k], override[k]);
      else base[k] = override[k];
    }
    return base;
  }
  let saveTimer = null;
  function saveUserData(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      if (!currentUser) return;
      try { await setDoc(doc(db, 'taiSearchUsers', currentUser.uid), userData, { merge:true }); } catch(e){ console.warn(e); }
    }, 400);
  }
  function applyPersonalization(){
    const p = userData.personalization;
    document.body.dataset.theme = p.theme;
    document.documentElement.style.setProperty('--accent', p.accent);
    const wallpaperEl = document.getElementById('logoCard');
    if (wallpaperEl) {
      if (p.wallpaper === 'custom' && p.customBgUrl) wallpaperEl.style.setProperty('--wallpaper', `url(${p.customBgUrl}) center/cover`);
      else wallpaperEl.style.removeProperty('--wallpaper');
    }
  }

  // ================= 画面切替 =================
  const SCREENS = ['login','home','results','options','account','searchSettings','personal','fav'];
  function showScreen(name){
    SCREENS.forEach(s => document.getElementById(s + 'Screen').classList.add('hidden'));
    document.getElementById(name + 'Screen').classList.remove('hidden');
  }
  document.getElementById('optionsBtn').addEventListener('click', () => showScreen('options'));
  document.getElementById('optionsBack').addEventListener('click', () => showScreen('home'));
  document.getElementById('resultsBack').addEventListener('click', () => showScreen('home'));

  // ================= モード切替 =================
  let currentMode = 'ai';
  document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => { currentMode = btn.dataset.mode; document.querySelectorAll('.mode-btn[data-mode]').forEach(b=>b.classList.toggle('active', b===btn)); });
  });
  document.getElementById('moreModeBtn').addEventListener('click', () => document.getElementById('moreModeSheet').classList.remove('hidden'));
  document.getElementById('closeMoreModeBtn').addEventListener('click', () => document.getElementById('moreModeSheet').classList.add('hidden'));
  document.querySelectorAll('#moreModeSheet .opt-row[data-mode]').forEach(row => {
    row.addEventListener('click', () => {
      currentMode = row.dataset.mode;
      document.getElementById('moreModeSheet').classList.add('hidden');
      const q = document.getElementById('searchInput').value.trim();
      if (q) runSearch(q); else showScreen('home');
    });
  });

  // ================= 検索実行 =================
  document.getElementById('searchGoBtn').addEventListener('click', () => runSearch(document.getElementById('searchInput').value.trim()));
  document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key==='Enter') runSearch(e.target.value.trim()); });

  // ================= Gemini共通呼び出し(AI・Web両方で使う) =================
  async function callGemini(q){
    const key = getKey('gemini');
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${key}`;
    const res = await fetch(url, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents:[{ parts:[{ text:q }] }], tools:[{ google_search:{} }] })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const cand = data.candidates && data.candidates[0];
    const text = cand && cand.content && cand.content.parts ? cand.content.parts.map(p=>p.text||'').join('') : '(回答を取得できなかったよ)';
    const chunks = (cand && cand.groundingMetadata && cand.groundingMetadata.groundingChunks) || [];
    const sources = chunks.filter(c=>c.web).map(c => ({ title:c.web.title||c.web.uri, url:c.web.uri }));
    return { text, sources };
  }

    try {

  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ================= 画像検索(Openverse + Wikimedia Commons) =================
  async function renderImageResults(q, body){
    try {
      const [ovRes, wmRes] = await Promise.allSettled([
        fetch(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=12`).then(r=>r.json()),
        fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url&iiurlwidth=300&format=json&origin=*`).then(r=>r.json())
      ]);
      let items = [];
      if (ovRes.status === 'fulfilled' && ovRes.value.results) {
        items = items.concat(ovRes.value.results.map(r => ({ thumb:r.thumbnail||r.url, url:r.foreign_landing_url||r.url, title:r.title||q, source:'Openverse' })));
      }
      if (wmRes.status === 'fulfilled' && wmRes.value.query && wmRes.value.query.pages) {
        Object.values(wmRes.value.query.pages).forEach(p => {
          if (p.imageinfo && p.imageinfo[0]) items.push({ thumb:p.imageinfo[0].thumburl, url:p.imageinfo[0].url, title:p.title, source:'Wikimedia' });
        });
      }
      items = applySensitiveFilter(items, 'Image');
      if (!items.length) { body.innerHTML = '<div class="card"><p class="sub">画像が見つからなかったよ。</p></div>'; return; }
      let html = '<div class="image-grid">';
      items.forEach((it, i) => {
        const blur = it.__blurred;
        html += `<div class="image-item" data-i="${i}" data-url="${it.url}">
          <img src="${it.thumb}" class="${blur?'blurred':''}" loading="lazy">
          ${blur ? '<div class="blur-note">タップして表示</div>' : ''}
          <div class="cap">${escapeHtml(it.source)}</div>
        </div>`;
      });
      html += '</div>';
      body.innerHTML = html;
      body.querySelectorAll('.image-item').forEach(el => {
        el.addEventListener('click', () => {
          const img = el.querySelector('img');
          if (img.classList.contains('blurred')) { img.classList.remove('blurred'); el.querySelector('.blur-note')?.remove(); return; }
          window.open(el.dataset.url, userData.searchSettings.openInNewTab ? '_blank' : '_self');
        });
      });
    } catch (err) { body.innerHTML = `<div class="card"><p class="sub">エラー: ${escapeHtml(err.message)}</p></div>`; }
  }

  async function renderNewsResults(q, body){

  // ================= マップ(Nominatim + Leaflet) =================
  let leafletLoaded = false;
  function ensureLeaflet(){
    return new Promise((resolve) => {
      if (leafletLoaded || window.L) { leafletLoaded = true; resolve(); return; }
      const css = document.createElement('link'); css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
      const script = document.createElement('script'); script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      script.onload = () => { leafletLoaded = true; resolve(); };
      document.head.appendChild(script);
    });
  }
  async function renderMapResults(q, body){
    body.innerHTML = '<div class="card"><div class="map-box" id="mapBox"></div><div id="mapList"></div></div>';
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=8`;
      const res = await fetch(url, { headers: { 'Accept-Language':'ja' } });
      const data = await res.json();
      await ensureLeaflet();
      const first = data[0];
      const map = L.map('mapBox').setView(first ? [Number(first.lat), Number(first.lon)] : [35.68,139.76], first ? 13 : 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' }).addTo(map);
      const list = document.getElementById('mapList');
      data.forEach(place => {
        L.marker([Number(place.lat), Number(place.lon)]).addTo(map).bindPopup(place.display_name);
        const row = document.createElement('div'); row.className = 'result-item';
        row.innerHTML = `<div class="title" style="font-size:13px;">📍 ${escapeHtml(place.display_name)}</div>`;
        row.addEventListener('click', () => map.setView([Number(place.lat), Number(place.lon)], 15));
        list.appendChild(row);
      });
      if (!data.length) document.getElementById('mapList').innerHTML = '<p class="sub">場所が見つからなかったよ。</p>';
    } catch (err) { body.innerHTML = `<div class="card"><p class="sub">地図を読み込めなかったよ: ${escapeHtml(err.message)}</p></div>`; }
  }

  // ================= センシティブフィルタ =================
  const SENSITIVE_WORDS = ['アダルト','r18','エロ','violence','gore','porn'];
  function applySensitiveFilter(items, scopeKey){
    const s = userData.searchSettings;
    const scopeOn = s['sensitiveScope' + scopeKey];
    if (!scopeOn) return items;
    return items.map(it => {
      const text = ((it.title||'') + ' ' + (it.url||'')).toLowerCase();
      const hit = SENSITIVE_WORDS.some(w => text.includes(w));
      if (!hit) return it;
      if (s.sensitiveMode === 'hide') return { ...it, __hidden:true };
      if (s.sensitiveMode === 'blur') return { ...it, __blurred:true };
      return { ...it, __hidden:true }; // block(デフォルト)
    }).filter(it => !it.__hidden);
  }

      row.querySelector('button').addEventListener('click', () => {
        const v = prompt(label + 'を入力してね', getKey(k));
        if (v !== null) setKey(k, v.trim());
      });
      card2.appendChild(row);
    });
    el.appendChild(card2);

    el.innerHTML += `<div class="set-cat-title">その他の検索設定</div>`;
    const card3 = document.createElement('div'); card3.className = 'card';
    SEARCH_SETTINGS_EXTRA.forEach(([key,label,type,options]) => {
      const row = document.createElement('div'); row.className = 'set-row';
      if (type === 'toggle') {
        row.innerHTML = `<span>${label}</span>`;
        const sw = document.createElement('button'); sw.className = 'switch' + (userData.searchSettings[key]?' on':'');
        sw.addEventListener('click', () => { userData.searchSettings[key] = !userData.searchSettings[key]; sw.classList.toggle('on'); saveUserData(); });
        row.appendChild(sw);
      } else if (type === 'select') {
        row.innerHTML = `<span>${label}</span>`;
        const sel = document.createElement('select');
        options.forEach(([v,t]) => { const o=document.createElement('option'); o.value=v; o.textContent=t; if (userData.searchSettings[key]===v) o.selected=true; sel.appendChild(o); });
        sel.addEventListener('change', () => { userData.searchSettings[key] = sel.value; saveUserData(); });
        row.appendChild(sel);
      } else {
        row.innerHTML = `<span>${label}</span>`;
        const input = document.createElement('input'); input.type='text'; input.value = userData.searchSettings[key]||''; input.style.width='110px';
        input.addEventListener('change', () => { userData.searchSettings[key] = input.value; saveUserData(); });
        row.appendChild(input);
      }
      card3.appendChild(row);
    });
    el.appendChild(card3);
  }

  // ================= オプション: 個人設定 =================
  document.getElementById('toPersonalOpt').addEventListener('click', () => { renderPersonalScreen(); showScreen('personal'); });
  document.getElementById('personalBack').addEventListener('click', () => { applyPersonalization(); showScreen('options'); });
  const APPLE_COLORS = ['#FF3B30','#FF9500','#FFCC00','#34C759','#00C7BE','#30B0C7','#32ADE6','#007AFF','#5856D6','#AF52DE','#FF2D55','#A2845E'];
  function renderPersonalScreen(){
    const el = document.getElementById('personalScroll'); el.innerHTML = '';
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `
      <h2>背景</h2>
      <div class="field"><label>カスタム写真をアップロード</label><input type="file" accept="image/*" id="bgFileInput"></div>
      <img id="bgPreview" style="width:100%; border-radius:12px; margin-bottom:10px; display:${userData.personalization.customBgUrl?'block':'none'};" src="${userData.personalization.customBgUrl||''}">
      <button class="btn btn-outline" id="resetBgBtn">デフォルトに戻す</button>
      <h2 style="margin-top:18px;">アクセントカラー</h2>
      <div class="swatch-row" id="accentSwatchRow"></div>
      <h2 style="margin-top:18px;">テーマ</h2>
      <div class="set-row"><span>ライト/ダーク</span>
        <select id="themeSel"><option value="light">ライト</option><option value="dark">ダーク</option></select>
      </div>`;
    el.appendChild(card);
    document.getElementById('bgFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        userData.personalization.wallpaper = 'custom';
        userData.personalization.customBgUrl = ev.target.result;
        document.getElementById('bgPreview').src = ev.target.result;
        document.getElementById('bgPreview').style.display = 'block';
        saveUserData(); applyPersonalization();
      };
      reader.readAsDataURL(file);
    });
    document.getElementById('resetBgBtn').addEventListener('click', () => {
      userData.personalization.wallpaper = 'default'; userData.personalization.customBgUrl = '';
      document.getElementById('bgPreview').style.display = 'none';
      saveUserData(); applyPersonalization();
    });
    const swatchRow = document.getElementById('accentSwatchRow');
    APPLE_COLORS.forEach(c => {
      const s = document.createElement('div'); s.className = 'swatch' + (userData.personalization.accent===c?' active':''); s.style.background = c;
      s.addEventListener('click', () => { document.querySelectorAll('#accentSwatchRow .swatch').forEach(x=>x.classList.remove('active')); s.classList.add('active'); userData.personalization.accent = c; saveUserData(); applyPersonalization(); });
      swatchRow.appendChild(s);
    });
    document.getElementById('themeSel').value = userData.personalization.theme;
    document.getElementById('themeSel').addEventListener('change', (e) => { userData.personalization.theme = e.target.value; saveUserData(); applyPersonalization(); });
  }
</script>
</body>
</html>
